<html>
<head>
    <title>State at Block {{ handler.block_number }} - Zentra Explorer</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    {% include 'nav.html' %}

    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6 border border-gray-200">
            <h2 class="text-2xl font-bold">State at Block #{{ handler.block_number }}</h2>
            <hr>
            <div class="flex justify-between my-4">
                <div class="flex-1 text-left">
                    {% if handler.block_number > 1 %}
                        <a href="/state?chain={{ handler.chain }}&blockno={{ handler.block_number - 1 }}" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Prev</a>
                    {% else %}
                        <a class="bg-gray-400 text-white font-bold py-2 px-4 rounded cursor-not-allowed">Prev</a>
                    {% end if %}
                        <a href="/state?chain={{ handler.chain }}&blockno={{ handler.block_number + 1 }}" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Next</a>
                </div>
    
                <a href="/state?chain={{ handler.chain }}" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Latest</a>
            </div>
            <br>

            <div class="space-y-2">
            {% for i in handler.state_keys %}
            <div class="border rounded-md p-3">
                <div class="flex items-center justify-between cursor-pointer item-header">
                    <div class="flex items-center">
                        <span class="toggle-icon mr-2 text-orange-500">▷</span>
                        <span class="font-mono text-sm {{ '' if handler.state_values[i][0] == handler.block_number else 'text-gray-400' }}">{{ i }}</span>
                    </div>
                    <span class="text-xs rounded bg-gray-200 px-2 py-1">{{ handler.state_values[i][0] }}</span>
                </div>
                <div class="value_content hidden mt-2 pl-6">
                    <pre class="bg-gray-100 p-3 rounded-md text-sm break-all whitespace-pre-wrap"><code>{{ handler.state_values[i][1] }}</code></pre>
                </div>
            </div>
            {% end for %}
            </div>
        </div>
    </div>
<script type="module">
document.querySelectorAll('.item-header').forEach(header => {
    header.addEventListener('click', () => {
        const content = header.nextElementSibling;
        const icon = header.querySelector('.toggle-icon');
        
        content.classList.toggle('hidden');
        if (content.classList.contains('hidden')) {
            icon.textContent = '▷';
        } else {
            icon.textContent = '▼';
        }
    });
});
</script>

</body>
</html>
