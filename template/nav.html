<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Select all dropdown groups in the nav
        const dropdowns = document.querySelectorAll('nav div.group');

        dropdowns.forEach(function (dropdown) {
            const trigger = dropdown.querySelector('div');
            const menu = dropdown.querySelector('ul');

            if (trigger && menu) {
                // Click handler for the trigger
                trigger.addEventListener('click', function (e) {
                    e.stopPropagation(); // Prevent ensuring document click immediately closes it

                    // Close other open dropdowns
                    dropdowns.forEach(function (d) {
                        if (d !== dropdown) {
                            const m = d.querySelector('ul');
                            if (m) m.classList.add('hidden');
                        }
                    });

                    // Toggle the current menu
                    menu.classList.toggle('hidden');
                });
            }
        });

        // Close dropdowns when clicking outside
        document.addEventListener('click', function (e) {
            dropdowns.forEach(function (dropdown) {
                const menu = dropdown.querySelector('ul');
                if (menu && !menu.classList.contains('hidden')) {
                    // Check if click is inside the menu (optional, but usually clicking item navigates away)
                    // If we want to keep it open when clicking inside:
                    if (!dropdown.contains(e.target)) {
                        menu.classList.add('hidden');
                    }
                }
            });
        });
    });
</script>
