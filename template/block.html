<html>
<head>
    <title>Block {{ handler.block_number }} - Zentra Explorer</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    {% include 'nav.html' %}
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6 border border-gray-200">
            <h2 class="text-2xl font-bold mb-4">Block #{{ handler.block_number }}</h2>
            <hr><br>
            <a href="/state?chain={{ handler.chain }}&blockno={{ handler.block_number }}" class="bg-yellow-200 text-orange-700 font-mono px-3 py-1 rounded hover:bg-yellow-300 font-semibold transition-colors duration-150 inline-block mb-4">
                &#x1F50D; Show Block State
            </a>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="md:col-span-1 font-semibold">Block Hash</div>
                <div class="md:col-span-2 font-mono text-gray-800 break-all">{{ handler.block_hash }}</div>
            </div>

            <h3 class="text-xl font-bold mb-4 mt-6">Transactions</h3>
            <ul class="divide-y divide-gray-200">
                {% for tx_hash, tx_index in handler.txs %}
                <li class="py-3 flex items-center justify-between">
                    <div class="flex items-center">
                        <span class="text-gray-500 mr-3">#{{ tx_index }}</span>
                        <a href="/tx?chain={{ handler.chain }}&txhash={{ tx_hash }}" class="text-orange-500 hover:text-orange-600 font-mono">{{ tx_hash }}</a>
                    </div>
                </li>
                {% end for %}
            </ul>
        </div>
    </div>
</body>
</html>
